<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveVeriff — Review Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><a class="brand" href="index.html"><span>V</span> LiveVeriff</a><span class="tag">REVIEW CONSOLE</span></header><main class="admin"><div class="adminhead"><div><p class="eyebrow">OPERATIONS</p><h1>Verification review</h1><p class="sub">Manual review dashboard for the school demonstration.</p></div><button id="refresh" class="btn secondary">Refresh</button></div><div class="stats"><div><small>Total</small><strong id="total">0</strong></div><div><small>Under review</small><strong id="review">0</strong></div><div><small>Approved</small><strong id="approved">0</strong></div><div><small>Rejected</small><strong id="rejected">0</strong></div></div><div class="admin-grid"><section class="list"><div class="listhead"><b>Submissions</b><span id="count">0</span></div><div id="rows"></div></section><section class="detail"><div id="emptyDetail" class="empty">Select a submission to review.</div><div id="detailContent" class="hidden"><div class="detailtop"><div><p class="eyebrow">APPLICATION</p><h2 id="dName"></h2><span id="dRef" class="muted"></span></div><span id="dStatus" class="statuspill"></span></div><div class="detailinfo"><div><small>Date of birth</small><b id="dDob"></b></div><div><small>Country</small><b id="dCountry"></b></div><div><small>Document</small><b id="dDoc"></b></div><div><small>Submitted</small><b id="dTime"></b></div></div><div class="images"><figure><figcaption>Identity document</figcaption><img id="dDocImg"></figure><figure><figcaption>Selfie</figcaption><img id="dSelfieImg"></figure></div><label>Admin notes<textarea id="notes" rows="4" placeholder="Optional review notes..."></textarea></label><div class="reviewbuttons"><button data-status="approved" class="btn approve">Approve</button><button data-status="resubmission_requi
